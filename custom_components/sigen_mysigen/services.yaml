start_battery_override:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sigen_mysigen
    mode:
      required: true
      default: hold_battery
      selector:
        select:
          translation_key: override_mode
          options:
            - hold_battery
            - charging
            - discharging
            - self_consumption
    duration:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    power_limit:
      required: false
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: kW
          mode: box

cancel_battery_override:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sigen_mysigen
